<style>

</head><body><div class="shell"><header class="top"><div class="brand"><div class="mark">XV</div><div><b>CITYFIT</b><div class="sub">STRONGER TOGETHER · EST. 2012</div></div></div><span class="pill" id="seasonBadge">2027 PROGRAM</span></header><div id="notice" class="banner hide"></div><main id="main"><div class="card"><h2>Loading CityFit workouts…</h2><p>If this message remains, the app could not start.</p></div></main><footer class="footer">CityFit Gear · <a href="https://oosiris-shop.fourthwall.com/collections/cityfit" target="_blank" rel="noopener">Shop the collection ↗</a><div style="margin-top:12px"><a href="install.html">Install CityFit on your phone ↗</a></div><div style="margin-top:12px"><a href="https://docs.google.com/forms/d/e/1FAIpQLSdrHEsSSdsyLr4JW2494ZD4NqbKKiAtONmNJ8YmZR-3NZncGA/viewform" target="_blank" rel="noopener noreferrer">Send Feedback ↗</a></div></footer></div><nav class="nav"><div class="navinner"><button data-tab="today" class="selected"><span class="ico">◉</span>Today</button><button data-tab="calendar"><span class="ico">▦</span>Calendar</button><button data-tab="log"><span class="ico">▤</span>My Log</button></div></nav><script>
'use strict';
// Set this URL after deploying the separate, read-only Apps Script web app.
const API_URL = 'https://script.google.com/macros/s/AKfycbztYO8hupbEoKsv30nmEfi5UgRhp1VaLRBxgNZlcDCI6v_Ps-VYnkxTzJDrrqIFSqOs/exec';
const START = '2026-11-02';
const END = '2027-10-29';
const sample = {'2026-11-02':{focus:'Pull/Push',description:'6 rounds (4’ of work and 1’ rest)\n12 bb shoulder press (85)\n12 db rows (45)\n12 decline push ups (tire)\n12 incline push ups (tire)\n6 burpees',source:'2023 S3M2 Cardio - Derek'},'2027-01-06':{focus:'Bench Press',phase:'Hypertrophy I',description:'4×10 Main Lift\n3×10 Close-grip bench\n3×10 DB incline\n4×10 row\n3×12 triceps',benchGroups:[{name:'Group A',weight:'Main 160 / Supplemental 135'},{name:'Group B',weight:'Main 140 / Supplemental 115'},{name:'Group C',weight:'Main 125 / Supplemental 105'},{name:'Group D',weight:'Main 110 / Supplemental 90'}]}};
let workouts={...sample};let selected=START;let tab='today';let month='2026-11';let live=false;
const $=s=>document.querySelector(s);
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function utcDate(key){return new Date(key+'T12:00:00Z')};function keyOf(d){return d.toISOString().slice(0,10)};function plus(key,n){const d=utcDate(key);d.setUTCDate(d.getUTCDate()+n);return keyOf(d)};
function weekday(key){return utcDate(key).getUTCDay()};function pretty(key,opt={weekday:'long',month:'long',day:'numeric',year:'numeric'}){return utcDate(key).toLocaleDateString('en-US',{...opt,timeZone:'UTC'})};
function lead(key){const days=Math.round((utcDate(key)-utcDate(START))/86400000);return ['Roberto','Jeff','Derek'][((Math.floor(days/28)%3)+3)%3]};
function season(key){let week=Math.floor((utcDate(key)-utcDate(START))/86400000/7);return ['Hypertrophy','Muscular Endurance','Cardio / HIIT','Strength / Long Duration'][((Math.floor(week/13)%4)+4)%4]};
function todayKey(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const x=Object.fromEntries(parts.map(p=>[p.type,p.value]));return `${x.year}-${x.month}-${x.day}`};
function monday(key){return plus(key,-((weekday(key)+6)%7))};
function showNotice(message){$('#notice').textContent=message;$('#notice').classList.remove('hide')};
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('selected',b.dataset.tab===tab));$('#seasonBadge').textContent=season(selected);if(tab==='today')renderToday();else if(tab==='calendar')renderCalendar();else renderLog()};
function renderToday(){let m=monday(selected);let days=[0,1,2,3,4].map(i=>plus(m,i));let w=workouts[selected];let wed=weekday(selected)===3;let inRange=selected>=START&&selected<=END;$('#main').innerHTML=`<div class="headrow"><div><div class="eyebrow">${escape(pretty(selected))}</div><h1>Workout of the Day</h1></div><button class="btn secondary" id="goToday">Today</button></div><div class="daynav">${days.map(k=>`<button class="day ${k===selected?'active':''}" data-date="${k}"><small>${escape(pretty(k,{weekday:'short'}))}</small>${Number(k.slice(8))}</button>`).join('')}</div>${!inRange?'<div class="banner">Outside the 2027 programming year. Choose a date from November 2, 2026 through October 29, 2027.</div>':''}<div class="card">${w?`<div class="eyebrow">${escape(season(selected))}</div><h2>${escape(w.focus||'Workout')}</h2>${wed?'':`<div class="meta">Leading today’s workout is <strong>${escape(lead(selected))}</strong>${w.source?`<br>Workout source: <strong>${escape(w.source)}</strong>`:''}</div>`}<div class="sectionline"></div>${w.phase?`<div class="meta">Phase: <strong>${escape(w.phase)}</strong></div>`:''}<div class="workout">${escape(w.description||'')}</div>${w.benchGroups?.length?`<div class="sectionline"></div><h2>Bench training weights</h2><div class="weightgrid">${w.benchGroups.map(g=>`<div class="weight"><b>${escape(g.name)}</b><span>${escape(g.weight)}</span></div>`).join('')}</div>`:''}`:`<div class="empty"><h2>${weekday(selected)===0||weekday(selected)===6?'Rest day':'Workout not loaded'}</h2>${live?'No workout found for this date.':'Connect your CityFit Google Sheet to load the complete program.'}</div>`}</div><div class="headrow"><button class="btn secondary" id="prevDay">← Previous</button><button class="btn secondary" id="nextDay">Next →</button></div>`;$('#goToday').onclick=()=>{selected=todayKey();month=selected.slice(0,7);render()};$('#prevDay').onclick=()=>{selected=plus(selected,-1);render()};$('#nextDay').onclick=()=>{selected=plus(selected,1);render()};document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;render()})};
function renderCalendar(){let [y,mo]=month.split('-').map(Number);let first=`${month}-01`;let start=plus(first,-weekday(first));let cells=Array.from({length:42},(_,i)=>plus(start,i));$('#main').innerHTML=`<div class="eyebrow">2027 Annual Programming</div><h1>Workout Calendar</h1><div class="calheader"><button id="monthPrev">←</button><h2>${escape(pretty(first,{month:'long',year:'numeric'}))}</h2><button id="monthNext">→</button></div><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="calday">${x}</div>`).join('')}${cells.map(k=>`<button class="date ${k.slice(0,7)!==month?'other':''} ${k===selected?'selected':''} ${k===todayKey()?'today':''}" data-pick="${k}"><span>${Number(k.slice(8))}</span><small>${workouts[k]?escape((workouts[k].focus||'Workout').replace('Bench Press','Bench')):''}</small></button>`).join('')}</div><div class="card"><div class="meta">Select any date to open its workout. Browse the complete CityFit programming year.</div></div>`;$('#monthPrev').onclick=()=>{month=plus(first,-1).slice(0,7);render()};$('#monthNext').onclick=()=>{month=plus(`${month}-${new Date(Date.UTC(y,mo,0)).getUTCDate()}`,1).slice(0,7);render()};document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{selected=b.dataset.pick;tab='today';render()})};
function renderLog(){if(window.cityfitRenderLog){window.cityfitRenderLog();return;}$('#main').innerHTML='<div class="card"><h2>Loading personal workout log…</h2></div>'};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
async function load(){if(!API_URL){showNotice('Preview mode: showing two sample workouts. Connect the read-only Google Sheets API to load the full year.');return}try{let json=await new Promise((resolve,reject)=>{let script=document.createElement('script');let done=false;let timeout=setTimeout(()=>finish(Error('Connection timed out')),15000);function finish(err,data){if(done)return;done=true;clearTimeout(timeout);delete window.cityfitReceive;script.remove();err?reject(err):resolve(data)}window.cityfitReceive=data=>finish(null,data);script.onerror=()=>finish(Error('Could not reach Google Apps Script'));script.src=API_URL+(API_URL.includes('?')?'&':'?')+'callback=cityfitReceive&v='+Date.now();document.head.append(script)});if(!json.ok||!json.workouts)throw Error(json.error||'Unexpected API response');workouts=json.workouts;live=true;$('#notice').classList.add('hide')}catch(e){showNotice('Could not load live workouts: '+e.message+'. Showing sample data.')}}
(async()=>{let t=todayKey();selected=(t>=START&&t<=END)?t:START;month=selected.slice(0,7);await load();render()})();


</script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBJ0b_22RLs1qwkxj8n9A9_EM0ZT3guytE",
  authDomain: "cityfit-workout-app.firebaseapp.com",
  projectId: "cityfit-workout-app",
  storageBucket: "cityfit-workout-app.firebasestorage.app",
  messagingSenderId: "307788439314",
  appId: "1:307788439314:web:8b77fb855b8d7986e19dcb"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
let user = null;
let entries = [];
let loading = false;
let editingDate = null;
let status = '';
let statusError = false;
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const logRoot = () => document.querySelector('#main');
const logCollection = () => collection(db, 'users', user.uid, 'workouts');
const logDoc = date => doc(db, 'users', user.uid, 'workouts', date);
const isDate = value => /^\d{4}-\d{2}-\d{2}$/.test(value) && !Number.isNaN(Date.parse(value+'T12:00:00Z'));
const logActive = () => typeof tab !== 'undefined' && tab === 'log';
const showStatus = (message, isError=false) => {status=message;statusError=isError;const el=document.querySelector('#log-status');if(el){el.textContent=message;el.classList.toggle('error',isError)}};
const errorText = e => {
  const code = String(e?.code || '');
  if(code.includes('popup-blocked')) return 'The sign-in popup was blocked. Allow popups for this website and try again.';
  if(code.includes('unauthorized-domain')) return 'This website is not authorized for Firebase sign-in. Check Authentication → Settings → Authorized domains.';
  if(code.includes('permission-denied')) return 'Firestore denied access. Check the published security rules.';
  return e?.message || 'Something went wrong. Please try again.';
};

async function fetchLogs(){
  if(!user)return;
  loading=true;if(logActive())renderLog();
  try{
    const snapshot=await getDocs(logCollection());
    entries=snapshot.docs.map(s=>({id:s.id,...s.data()})).sort((a,b)=>b.id.localeCompare(a.id));
    showStatus('');
  }catch(e){entries=[];showStatus(errorText(e),true)}
  finally{loading=false;if(logActive())renderLog()}
}
function entryForm(){
  const date=editingDate || ((selected>=START&&selected<=END)?selected:todayKey());
  const existing=entries.find(e=>e.id===date)||{};
  return `<div class="card">
    <h2>${existing.date?'Edit workout':'Log a workout'}</h2>
    <form id="workoutLogForm">
      <label class="log-field" for="logDate">Workout date</label>
      <input class="log-input" id="logDate" type="date" value="${esc(date)}" required>
      <label class="log-field" for="logResult">Result (rounds, reps, time, etc.)</label>
      <input class="log-input" id="logResult" maxlength="300" placeholder="Example: 6 rounds completed" value="${esc(existing.result||'')}">
      <label class="log-field" for="logWeights">Weights used (optional)</label>
      <input class="log-input" id="logWeights" maxlength="300" placeholder="Example: 85 lb barbell, 45 lb dumbbells" value="${esc(existing.weights||'')}">
      <label class="log-field" for="logNotes">Personal notes (optional)</label>
      <textarea class="log-input" id="logNotes" rows="4" maxlength="2000" placeholder="How did it go?">${esc(existing.notes||'')}</textarea>
      <label class="log-field"><input type="checkbox" id="logCompleted" ${existing.completed===false?'':'checked'}> Completed workout</label>
      <div class="log-actions"><button class="btn" type="submit" id="logSave">Save workout</button><button class="btn secondary" type="button" id="logClear">Clear form</button></div>
    </form>
    <div class="log-status ${statusError?'error':''}" id="log-status" role="status">${esc(status)}</div>
  </div>`;
}
function renderLog(){
  const main=logRoot();
  if(!user){
    main.innerHTML=`<div class="eyebrow">Private workout tracking</div><h1>My Workout Log</h1>
      <div class="card"><h2>Sign in to save your results</h2>
      <p class="muted">Use your Google account to keep a private history of your workouts. Viewing today's workout and the calendar never requires sign-in.</p>
      <button class="btn" id="logSignIn">Sign in with Google</button>
      <div class="log-status ${statusError?'error':''}" id="log-status" role="status">${esc(status)}</div></div>`;
    document.querySelector('#logSignIn').onclick=async()=>{
      showStatus('Opening Google sign-in…');
      try{await setPersistence(auth,browserLocalPersistence);await signInWithPopup(auth,provider)}
      catch(e){if(e.code!=='auth/popup-closed-by-user')showStatus(errorText(e),true);else showStatus('Sign-in canceled.')}
    };
    return;
  }
  main.innerHTML=`<div class="eyebrow">Private workout tracking</div><h1>My Workout Log</h1>
    <div class="meta">Signed in as <strong>${esc(user.email||'Google user')}</strong> · <button class="btn secondary" id="logSignOut" type="button">Sign out</button></div>
    ${entryForm()}
    <div class="card"><h2>Workout history</h2>
      ${loading?'<p class="muted">Loading your workouts…</p>':
        entries.length?entries.map(e=>`<div class="log-entry"><strong>${esc(pretty(e.id))}</strong> · ${e.completed===false?'Not completed':'Completed'}
          ${e.result?`<p><strong>Result:</strong> ${esc(e.result)}</p>`:''}
          ${e.weights?`<p><strong>Weights:</strong> ${esc(e.weights)}</p>`:''}
          ${e.notes?`<p><strong>Notes:</strong> ${esc(e.notes)}</p>`:''}
          <button class="btn secondary" data-log-edit="${esc(e.id)}">Edit</button>
          <button class="btn secondary" data-log-delete="${esc(e.id)}">Delete</button></div>`).join(''):
        '<p class="muted">No workouts logged yet. Save your first workout above.</p>'}
    </div>`;
  document.querySelector('#logSignOut').onclick=async()=>{try{await signOut(auth)}catch(e){showStatus(errorText(e),true)}};
  document.querySelector('#logClear').onclick=()=>{editingDate=null;status='';renderLog()};
  document.querySelector('#logDate').onchange=e=>{
    const match=entries.find(x=>x.id===e.target.value);
    if(match){editingDate=match.id;renderLog()}else{editingDate=e.target.value}
  };
  document.querySelector('#workoutLogForm').onsubmit=async e=>{
    e.preventDefault();
    const date=document.querySelector('#logDate').value;
    if(!isDate(date)){showStatus('Choose a valid workout date.',true);return}
    const result=document.querySelector('#logResult').value.trim();
    const weights=document.querySelector('#logWeights').value.trim();
    const notes=document.querySelector('#logNotes').value.trim();
    const completed=document.querySelector('#logCompleted').checked;
    if(!result&&!weights&&!notes&&!completed){showStatus('Enter a result or note, or mark the workout completed.',true);return}
    const btn=document.querySelector('#logSave');btn.disabled=true;showStatus('Saving…');
    try{
      await setDoc(logDoc(date),{date,completed,result,weights,notes,updatedAt:serverTimestamp()});
      editingDate=date;await fetchLogs();showStatus('Workout saved.');
    }catch(err){btn.disabled=false;showStatus(errorText(err),true)}
  };
  document.querySelectorAll('[data-log-edit]').forEach(b=>b.onclick=()=>{editingDate=b.dataset.logEdit;status='';renderLog();window.scrollTo({top:0,behavior:'smooth'})});
  document.querySelectorAll('[data-log-delete]').forEach(b=>b.onclick=async()=>{
    const date=b.dataset.logDelete;
    if(!confirm('Delete your workout log for '+pretty(date)+'? This cannot be undone.'))return;
    showStatus('Deleting…');
    try{await deleteDoc(logDoc(date));if(editingDate===date)editingDate=null;await fetchLogs();showStatus('Workout deleted.')}
    catch(err){showStatus(errorText(err),true)}
  });
}
window.cityfitRenderLog=renderLog;
onAuthStateChanged(auth, next=>{
  user=next;entries=[];editingDate=null;status='';statusError=false;
  if(logActive())renderLog();
  if(user)fetchLogs();
},e=>{user=null;showStatus(errorText(e),true);if(logActive())renderLog()});
</script>
